<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Builder — NEXUS AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>

<div class="builder-shell">

  <!-- Mobile backdrop for slide-up panes -->
  <div class="mobile-backdrop" id="mobile-backdrop"></div>

  <!-- ===== LEFT PANE (Prompt + Components + Templates) ===== -->
  <aside class="builder-pane" id="left-pane">
    <div class="pull-handle"></div>
    <div class="pane-head">
      <a href="dashboard.html" class="row gap-sm" style="color:inherit;">
        <span class="brand-mark" style="width:28px;height:28px;font-size:14px;border-radius:8px;">N</span>
        <span style="font-weight:700;">NEXUS<span class="text-grad">.</span>ai</span>
      </a>
      <button id="left-toggle" class="btn btn-ghost btn-icon" aria-label="Close panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="pane-body">
      <!-- PROMPT -->
      <section class="mb-lg">
        <div class="row between mb-sm"><h3 class="h-display" style="margin:0;font-size:15px;">AI Prompt</h3><span id="model-pill" class="tag">gpt-5-nano</span></div>
        <textarea id="prompt-input" class="textarea" rows="4" placeholder="Describe what to build…
e.g. Create a horror storytelling website with featured tales and dark fog animations."></textarea>
        <div class="row mt-sm" style="gap:6px;">
          <button id="generate-btn" class="btn btn-primary" style="flex:1;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            Generate
          </button>
          <button id="voice-btn" class="btn btn-ghost btn-icon" aria-label="Voice prompt" title="Voice prompt">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
          </button>
        </div>
        <div id="example-prompts" class="row wrap" style="gap:6px;margin-top:10px;">
          <span class="cat-pill" data-prompt="Create a horror storytelling website">🎃 Horror site</span>
          <span class="cat-pill" data-prompt="Create a Facebook Reel idea generator">🎬 Reel gen</span>
          <span class="cat-pill" data-prompt="Create a portfolio website for a designer">👤 Portfolio</span>
          <span class="cat-pill" data-prompt="Create an anime fan community page">🎌 Anime</span>
        </div>
      </section>

      <!-- COMPONENTS -->
      <section class="mb-lg">
        <h3 class="h-display" style="margin:0 0 10px;font-size:15px;">Components</h3>
        <p class="dim" style="margin:0 0 10px;font-size:12px;">Drag onto the preview, or tap to insert.</p>
        <div id="comp-list" class="col" style="gap:6px;"></div>
      </section>

      <!-- TEMPLATES -->
      <section>
        <h3 class="h-display" style="margin:0 0 10px;font-size:15px;">Templates</h3>
        <select id="template-cat" class="select mb-sm"></select>
        <div id="template-list" class="col" style="gap:6px;"></div>
      </section>
    </div>
  </aside>

  <!-- ===== CENTER (Preview) ===== -->
  <section class="preview-wrap">
    <div class="preview-toolbar">
      <input id="title-input" class="input" style="max-width:240px;border:0;background:transparent;font-weight:600;" placeholder="Untitled project">
      <span id="save-status" class="dim" style="font-size:12px;">Idle</span>
      <div style="flex:1;"></div>

      <div class="device-toggle" role="tablist" aria-label="Device preview">
        <button class="device-btn active" data-device="desktop" aria-label="Desktop">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          Desktop
        </button>
        <button class="device-btn" data-device="tablet" aria-label="Tablet">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M11 18h2"/></svg>
          Tablet
        </button>
        <button class="device-btn" data-device="mobile" aria-label="Mobile">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
          Mobile
        </button>
      </div>

      <div class="row gap-sm">
        <button id="undo-btn" class="btn btn-ghost btn-icon" title="Undo" aria-label="Undo">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6M21 17a9 9 0 00-15-6.7L3 13"/></svg>
        </button>
        <button id="redo-btn" class="btn btn-ghost btn-icon" title="Redo" aria-label="Redo">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6M3 17a9 9 0 0115-6.7L21 13"/></svg>
        </button>
        <button id="export-btn" class="btn btn-ghost btn-sm">Export ZIP</button>
        <button id="publish-btn" class="btn btn-primary btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5L20 7"/></svg>
          Publish
        </button>
      </div>
    </div>

    <div class="preview-stage">
      <div class="preview-frame desktop" id="preview-frame">
        <iframe id="preview-iframe" title="Preview"></iframe>
      </div>
    </div>
  </section>

  <!-- ===== RIGHT PANE (Inspector + AI Tools) ===== -->
  <aside class="builder-pane right" id="right-pane">
    <div class="pull-handle"></div>
    <div class="pane-head">
      <h3>AI Tools</h3>
      <button id="right-toggle" class="btn btn-ghost btn-icon" aria-label="Close panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="pane-body">
      <!-- Quick AI actions -->
      <section class="mb-lg">
        <h3 class="h-display" style="margin:0 0 10px;font-size:14px;">Quick Actions</h3>
        <div class="col gap-sm">
          <button class="btn btn-ghost" data-quick="redesign">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            Redesign UI
          </button>
          <button class="btn btn-ghost" data-quick="improve">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.5 7H22l-6 4.5L18 21l-6-4.5L6 21l2-7.5L2 9h7.5z"/></svg>
            Improve Code
          </button>
          <button class="btn btn-ghost" data-quick="palette">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="8.5" cy="9.5" r="1"/><circle cx="15.5" cy="9.5" r="1"/><circle cx="8.5" cy="15.5" r="1"/></svg>
            Color Palette
          </button>
          <button class="btn btn-ghost" data-quick="content">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            Content Writer
          </button>
          <button class="btn btn-ghost" data-quick="image">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
            Generate Image
          </button>
          <button class="btn btn-ghost" data-quick="logo">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 7v10M7 12h10"/></svg>
            Logo
          </button>
          <button class="btn btn-ghost" data-quick="caption">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18v14H3z"/><path d="M7 11h6M7 15h10"/></svg>
            Captions
          </button>
          <button class="btn btn-ghost" data-quick="story">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5v14z"/></svg>
            Horror Scene
          </button>
        </div>
      </section>

      <!-- Code panels -->
      <section>
        <div class="row" style="gap:6px;margin-bottom:8px;">
          <button class="btn btn-ghost btn-sm code-tab active" data-tab="html">HTML</button>
          <button class="btn btn-ghost btn-sm code-tab" data-tab="css">CSS</button>
          <button class="btn btn-ghost btn-sm code-tab" data-tab="js">JS</button>
        </div>
        <textarea id="code-html" class="textarea code-pane" rows="12" spellcheck="false" placeholder="HTML…"></textarea>
        <textarea id="code-css" class="textarea code-pane hide" rows="12" spellcheck="false" placeholder="CSS…"></textarea>
        <textarea id="code-js" class="textarea code-pane hide" rows="12" spellcheck="false" placeholder="JS…"></textarea>
      </section>
    </div>
  </aside>
</div>

<!-- Floating AI Assistant -->
<button class="ai-fab" id="ai-fab" title="AI Assistant" aria-label="AI Assistant">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
</button>
<div class="ai-panel glass-strong" id="ai-panel">
  <div class="pane-head">
    <div class="row gap-sm"><span class="brand-mark" style="width:24px;height:24px;border-radius:8px;font-size:12px;">N</span><h3>Assistant</h3></div>
    <button id="ai-close" class="btn btn-ghost btn-icon" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="ai-msgs" class="chat-msgs">
    <div class="msg bot">I can edit your project. Try: "make the hero centered", "add a contact form", "use a darker palette".</div>
  </div>
  <div class="chat-input-row">
    <textarea id="ai-input" class="textarea" placeholder="Ask the AI to change something…" rows="1"></textarea>
    <button id="ai-send" class="btn btn-primary btn-icon" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </div>
</div>

<!-- Floating bottom toolbar (mobile) -->
<div class="fab-toolbar" id="fab-toolbar">
  <button data-fab="prompt" title="Prompt">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v6M12 22v-6M4.93 4.93l4.24 4.24M14.83 14.83l4.24 4.24M2 12h6M22 12h-6M4.93 19.07l4.24-4.24M14.83 9.17l4.24-4.24"/></svg>
  </button>
  <button data-fab="preview" class="active" title="Preview">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button data-fab="device" title="Switch Device">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
  </button>
  <button data-fab="tools" title="AI Tools">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.5 7H22l-6 4.5L18 21l-6-4.5L6 21l2-7.5L2 9h7.5z"/></svg>
  </button>
  <button data-fab="publish" title="Publish">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/></svg>
  </button>
</div>

<script src="assets/js/ui.js"></script>
<script src="assets/js/puter-bridge.js"></script>
<script src="assets/js/ai-engine.js"></script>
<script src="assets/js/templates.js"></script>
<script src="assets/js/projects.js"></script>
<script src="assets/js/builder.js"></script>
</body>
</html>
