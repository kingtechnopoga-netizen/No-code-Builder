<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Sign in — NEXUS AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="brand">
      <span class="brand-mark">N</span>
      <span>NEXUS<span class="text-grad">.</span>ai</span>
    </a>
    <a href="index.html" class="btn btn-ghost btn-sm">← Back</a>
  </nav>

  <main style="min-height:calc(100vh - 80px);display:grid;place-items:center;padding:24px;position:relative;z-index:1;">
    <div class="glass-strong fade-up" style="max-width:440px;width:100%;padding:36px 28px;">
      <div class="center">
        <div class="brand-mark" style="margin:0 auto 16px;width:48px;height:48px;font-size:22px;border-radius:14px;"></div>
        <h1 class="h-display" style="font-size:28px;margin:0 0 8px;">Welcome to NEXUS</h1>
        <p class="muted" style="margin:0 0 28px;font-size:14px;line-height:1.55;">
          One click. Sign in with Puter — no passwords, no API keys, no setup. Your projects sync to your private cloud automatically.
        </p>
      </div>

      <button id="signin-btn" class="btn btn-primary btn-lg" style="width:100%;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        Continue with Puter
      </button>

      <div class="row" style="margin:22px 0;align-items:center;gap:10px;">
        <div style="flex:1;height:1px;background:var(--line);"></div>
        <span class="dim" style="font-size:12px;">or</span>
        <div style="flex:1;height:1px;background:var(--line);"></div>
      </div>

      <a href="builder.html" class="btn btn-ghost" style="width:100%;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11V7a3 3 0 116 0v4M5 11h14v10H5z"/></svg>
        Continue as guest
      </a>

      <p class="dim center" style="margin:24px 0 0;font-size:12px;line-height:1.5;">
        By continuing you agree to our <a href="#" style="color:var(--orange-300);">Terms</a> and <a href="#" style="color:var(--orange-300);">Privacy Policy</a>.
      </p>
    </div>
  </main>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/puter-bridge.js"></script>
  <script>
    (async function () {
      const { toast } = window.UI;
      const btn = document.getElementById('signin-btn');

      // If already signed in, redirect to dashboard
      try {
        if (await PuterBridge.isSignedIn()) {
          window.location.href = 'dashboard.html';
          return;
        }
      } catch {}

      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const orig = btn.innerHTML;
        btn.innerHTML = '<span class="spinner"></span> Connecting…';
        try {
          await PuterBridge.signIn();
          const user = await PuterBridge.getUser();
          if (user) {
            toast(`Welcome ${user.username || ''}!`, 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 600);
          } else {
            throw new Error('Sign-in cancelled');
          }
        } catch (err) {
          toast(err.message || 'Sign-in failed', 'error');
          btn.disabled = false;
          btn.innerHTML = orig;
        }
      });
    })();
  </script>
</body>
</html>
